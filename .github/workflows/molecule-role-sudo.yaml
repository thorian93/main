# https://github.com/ansible-collections/collection_template/blob/main/.github/workflows/ansible-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Molecule Test Sudo

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - devel
    types:
      - opened
    paths:
      - 'roles/sudo/**'
      - '.github/workflows/_template-molecule-test.yaml'
      - '.github/workflows/molecule-role-sudo.yaml'
  push:
    paths:
      - 'roles/sudo/**'
      - '!roles/**/*.md'
      - '.github/workflows/_template-molecule-test.yaml'
      - '.github/workflows/molecule-role-sudo.yaml'

jobs:

  integration:
    name: "Molecule"
    uses: ./.github/workflows/_template-molecule-test.yaml
    with:
      role: sudo
